[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "motifcue-anton"
version = "0.1.0"
description = "Local MotifCue analysis worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "httpx>=0.27,<1",
  "Pillow>=10.4,<12",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "reportlab>=4.2,<5",
  "rich>=13.9,<15",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
anton = "anton.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anton"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
